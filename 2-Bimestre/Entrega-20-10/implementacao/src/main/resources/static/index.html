<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurante | Cardápio</title><style>body{font:16px system-ui;background:#f5f6f8;color:#1e293b;margin:0}header{background:#19324b;color:white;padding:20px}main{max-width:920px;margin:25px auto;padding:0 16px}.painel{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 1px 5px #ddd}input,select,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:6px}button{background:#1765a3;color:white;cursor:pointer}li{margin:10px 0}.erro{color:#a22}</style></head><body><header><h1>Sistema de Gestão de Restaurante</h1><p>Primeira implementação • RF05: Cardápio</p></header><main><section class="painel"><h2>Cadastrar categoria</h2><form id="cat"><input name="nome" placeholder="Nome da categoria" required maxlength="100"><input name="descricao" placeholder="Descrição"><button>Salvar categoria</button></form></section><section class="painel"><h2>Cadastrar produto</h2><form id="prod"><input name="nome" placeholder="Nome do produto" required maxlength="100"><input name="descricao" placeholder="Descrição"><input name="preco" type="number" min="0.01" step="0.01" placeholder="Preço (R$)" required><select name="categoria" required></select><button>Salvar produto</button></form></section><section class="painel"><h2>Cardápio cadastrado</h2><ul id="lista"></ul></section><p id="msg" role="status"></p><p>Protótipo funcional inicial. Login, pedidos, estoque e pagamentos ainda não implementados.</p></main><script>
const $=id=>document.getElementById(id);async function request(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error((await r.text()).slice(0,200));return r.json()};async function refresh(){let [cats,prods]=await Promise.all([request('/api/categorias'),request('/api/produtos')]);let sel=$('prod').elements.categoria;sel.replaceChildren(new Option('Selecione a categoria',''));cats.forEach(c=>sel.add(new Option(c.nome,c.id)));$('lista').replaceChildren(...prods.map(p=>{let li=document.createElement('li');li.textContent=p.nome+' — '+p.categoria.nome+' — R$ '+Number(p.preco).toFixed(2).replace('.',',');return li}))}function show(s,err=false){$('msg').textContent=s;$('msg').className=err?'erro':''} $('cat').onsubmit=async e=>{e.preventDefault();try{let f=e.target.elements;await request('/api/categorias','POST',{nome:f.nome.value,descricao:f.descricao.value});e.target.reset();await refresh();show('Categoria salva.')}catch(e){show(e.message,true)}};$('prod').onsubmit=async e=>{e.preventDefault();try{let f=e.target.elements;await request('/api/produtos','POST',{nome:f.nome.value,descricao:f.descricao.value,preco:f.preco.value,ativo:true,categoria:{id:Number(f.categoria.value)}});e.target.reset();await refresh();show('Produto salvo.')}catch(e){show(e.message,true)}};refresh().catch(e=>show(e.message,true));
</script></body></html>
