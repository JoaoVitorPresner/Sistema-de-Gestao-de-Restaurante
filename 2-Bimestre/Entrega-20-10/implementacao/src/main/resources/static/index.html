
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Restaurante | Cardápio</title>

    <style>
        body {
            font: 16px system-ui;
            background: #f5f6f8;
            color: #1e293b;
            margin: 0;
        }

        header {
            background: #19324b;
            color: white;
            padding: 20px;
        }

        main {
            max-width: 920px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .painel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 1px 5px #ddd;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            background: #1765a3;
            color: white;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }

        .erro {
            color: #a22;
        }
        [hidden] {
    display: none !important;
}
    </style>
</head>

<body>

<header>
    <h1>Sistema de Gestão de Restaurante</h1>
    <p>Primeira implementação • RF05: Cardápio</p>
</header>

<main>

    <section class="painel">
        <h2>Cadastrar categoria</h2>

        <form id="cat">
            <input name="nome" placeholder="Nome da categoria" required maxlength="100">
            <input name="descricao" placeholder="Descrição">
            <button>Salvar categoria</button>
        </form>
    </section>

    <section class="painel">
        <h2>Cadastrar produto</h2>

        <form id="prod">
            <input name="nome" placeholder="Nome do produto" required maxlength="100">
            <input name="descricao" placeholder="Descrição">

            <input
                name="preco"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Preço (R$)"
                required
            >

            <select name="categoria" required></select>

            <button>Salvar produto</button>
        </form>
    </section>
    
<section class="painel" id="painel-edicao" hidden>
    <h2>Editar produto</h2>

    <form id="editar-produto">

        <input type="hidden" name="id">

        <input
            name="nome"
            placeholder="Nome do produto"
            required
            maxlength="100"
        >

        <input
            name="descricao"
            placeholder="Descrição"
            maxlength="255"
        >

        <input
            name="preco"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Preço (R$)"
            required
        >

        <select name="categoria" required></select>

        <button type="submit">Salvar alterações</button>
        <button type="button" id="cancelar-edicao">
            Cancelar
        </button>

    </form>
</section>

    <section class="painel">
        <h2>Cardápio cadastrado</h2>
        <ul id="lista"></ul>
    </section>

    <p id="msg" role="status"></p>

    <p>
        Protótipo funcional inicial. Login, pedidos, estoque e pagamentos
        ainda não implementados.
    </p>

</main>

<script>

    const $ = id => document.getElementById(id);

    // Requisições para a API
    async function request(url, method = 'GET', data) {

        const r = await fetch(url, {
            method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: data !== undefined ? JSON.stringify(data) : undefined
        });

        if (!r.ok) {
            throw Error((await r.text()).slice(0, 200));
        }

        // Respostas HTTP 204 não possuem conteúdo
        if (r.status === 204) {
            return null;
        }

        return await r.json();
    }

    // Atualiza as categorias e os produtos cadastrados
    async function refresh() {

        const [cats, prods] = await Promise.all([
            request('/api/categorias'),
            request('/api/produtos')
        ]);

        const sel = $('prod').elements.categoria;

        sel.replaceChildren(
            new Option('Selecione a categoria', '')
        );

        cats.forEach(c => {
            sel.add(new Option(c.nome, c.id));
        });

        
$('lista').replaceChildren(
    ...prods.map(p => {

        const li = document.createElement('li');

        const texto = document.createElement('span');

        texto.textContent =
            p.nome + ' — ' +
            p.categoria.nome + ' — R$ ' +
            Number(p.preco).toFixed(2).replace('.', ',');

        const btnEditar = document.createElement('button');
        btnEditar.type = 'button';
        btnEditar.textContent = 'Editar';
        
btnEditar.onclick = () => {

    const formulario = $('editar-produto');
    const campos = formulario.elements;

    campos.id.value = p.id;
    campos.nome.value = p.nome;
    campos.descricao.value = p.descricao || '';
    campos.preco.value = p.preco;

    const selectCategoria = campos.categoria;

    selectCategoria.replaceChildren(
        ...cats.map(c => new Option(c.nome, c.id))
    );

    selectCategoria.value = String(p.categoria.id);

    $('painel-edicao').hidden = false;

    $('painel-edicao').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });

    show('Editando produto: ' + p.nome);
};


        const btnDesativar = document.createElement('button');
        btnDesativar.type = 'button';
        btnDesativar.textContent = 'Desativar';
        
btnDesativar.onclick = async () => {

    const confirmar = confirm(
        'Deseja realmente desativar o produto "' + p.nome + '"?'
    );

    if (!confirmar) {
        return;
    }

    btnDesativar.disabled = true;

    try {
        await request('/api/produtos/' + p.id, 'DELETE');

        await refresh();

        show('Produto desativado com sucesso.');

    } catch (e) {
        btnDesativar.disabled = false;
        show('Erro ao desativar produto: ' + e.message, true);
    }
};


        if (!p.ativo) {
            texto.textContent += ' — Inativo';
            btnEditar.disabled = true;
            btnDesativar.disabled = true;
        }

        li.append(texto, btnEditar, btnDesativar);

        return li;
    })
);

    }

    // Exibe mensagens de sucesso ou erro
    function show(s, err = false) {
        $('msg').textContent = s;
        $('msg').className = err ? 'erro' : '';
    }

    // Cadastro de categorias
    $('cat').onsubmit = async e => {

        e.preventDefault();

        try {

            const f = e.target.elements;

            await request('/api/categorias', 'POST', {
                nome: f.nome.value,
                descricao: f.descricao.value
            });

            e.target.reset();

            await refresh();

            show('Categoria salva.');

        } catch (e) {
            show(e.message, true);
        }
    };

    // Cadastro de produtos
    $('prod').onsubmit = async e => {

        e.preventDefault();

        try {

            const f = e.target.elements;

            await request('/api/produtos', 'POST', {
                nome: f.nome.value,
                descricao: f.descricao.value,
                preco: f.preco.value,
                ativo: true,
                categoria: {
                    id: Number(f.categoria.value)
                }
            });

            e.target.reset();

            await refresh();

            show('Produto salvo.');

        } catch (e) {
            show(e.message, true);
        }
    };
    
    // Salvar edição de produto
    $('editar-produto').onsubmit = async e => {

        e.preventDefault();

        const formulario = e.target;
        const f = formulario.elements;
        const botaoSalvar = formulario.querySelector('button[type="submit"]');

        botaoSalvar.disabled = true;

        try {
            const id = Number(f.id.value);

            await request('/api/produtos/' + id, 'PUT', {
                nome: f.nome.value,
                descricao: f.descricao.value,
                preco: f.preco.value,
                ativo: true,
                categoria: {
                    id: Number(f.categoria.value)
                }
            });

            formulario.reset();
            $('painel-edicao').hidden = true;

            await refresh();

            show('Produto atualizado com sucesso.');

        } catch (erro) {
            show('Erro ao editar produto: ' + erro.message, true);
        } finally {
            botaoSalvar.disabled = false;
        }
    };

    // Cancelar edição
    $('cancelar-edicao').onclick = () => {
        $('editar-produto').reset();
        $('painel-edicao').hidden = true;
        show('Edição cancelada.');
    };

    // Carregamento inicial
    refresh().catch(e => show(e.message, true));

</script>

</body>
</html>
